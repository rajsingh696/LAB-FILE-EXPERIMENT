
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlinks and Images</title>
</head>
<body>

    <h3 id="top">Links demo</h3>

    <!-- External Link -->
    <a href="https://www.google.com" target="_blank">
        External link
    </a>
    <br>

    <!-- Internal Link -->
    <a href="#bottom">Jump to bottom</a>
    <br>

    <!-- Email Link -->
    <a href="mailto:admin@college.edu">Email us</a>
    <br>

    <!-- Image with Link -->
    <a href="https://www.google.com">
        <img src="logo.png"
             alt="Logo"
             width="100"
             height="60">
    </a>

    <br><br><br><br><br><br><br><br><br>

    <p id="bottom">
        Bottom.
        <a href="#top">Back to top</a>
    </p>

</body>
</html>
